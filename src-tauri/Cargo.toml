[package]
name = "harnessdock"
version = "0.1.0"
description = "Desktop manager for DeepSeek Harness (DSH) instances"
authors = ["cloudyview"]
license = "MIT"
edition = "2021"

[lib]
name = "harnessdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
